<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- user-scalable stays ON for accessibility; double-tap zoom is disabled in CSS via touch-action -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bol — बोल</title>
  <meta name="description" content="Bol: a free, offline, picture-based talking board (AAC) in Hindi and English.">
  <meta name="theme-color" content="#2a6f97">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar: language + caregiver controls -->
    <div id="toolbar">
      <button id="lang-toggle" class="btn small" aria-label="Switch language">EN → हिंदी</button>
      <span id="cg-tools" hidden>
        <button id="cg-add" class="btn small primary">＋ Add button</button>
        <button id="cg-settings" class="btn small">⚙️ Settings</button>
      </span>
      <span class="spacer"></span>
      <button id="cg-toggle" class="btn small">🔒 Caregiver</button>
    </div>

    <!-- Sentence bar: tapping it also speaks -->
    <div id="sentence-row">
      <div id="sentence" role="list" aria-label="Sentence — tap to speak"></div>
      <div class="sentence-actions">
        <button id="btn-delete" class="btn" aria-label="Delete last word">⌫<span class="btn-text"> Delete</span></button>
        <button id="btn-clear" class="btn" aria-label="Clear sentence">✕<span class="btn-text"> Clear</span></button>
        <button id="btn-save" class="btn" aria-label="Save to My phrases">★<span class="btn-text"> Save</span></button>
        <button id="btn-speak" class="btn speak" aria-label="Speak">🔊 Speak</button>
      </div>
    </div>

    <div id="phrases" class="strip" aria-label="My phrases"></div>
    <div id="recent" class="strip" aria-label="Recent words"></div>
    <nav id="tabs" aria-label="Boards"></nav>
    <div id="now-bar" class="bar" hidden></div>
    <div id="move-bar" class="bar" hidden></div>
    <main id="grid" aria-label="Symbol buttons"></main>
  </div>

  <!-- Visible messages: voice problems, errors, restores (always on top) -->
  <div id="status" role="status" aria-live="polite" hidden></div>
  <!-- Dialogs are placed here -->
  <div id="overlay" hidden></div>
  <!-- Shown when no sound is possible: words in big text for the listener -->
  <div id="show-card" hidden></div>

  <noscript>Bol needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
